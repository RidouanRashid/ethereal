<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ethereal: eenentwintig procedurele visioenen waar je doorheen scrolt." />
    <meta name="theme-color" content="#07060b" />
    <title>Ethereal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307060b'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ff5a4d' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f1ece4'/%3E%3C/svg%3E" />
  </head>
  <body>
    <h1 class="sr-only">Ethereal</h1>
    <canvas id="stage" aria-hidden="true"></canvas>

    <!-- Dunne lijn die laat zien hoe ver je bent; verder staat er niets in beeld. -->
    <div class="progress" aria-hidden="true"><div class="progress__fill" id="progress"></div></div>

    <!-- Lege ruimte om te scrollen; de hoogte wordt in main.js gezet. -->
    <main id="scroll" aria-label="Scrol om door de visioenen te gaan"></main>

    <p class="fallback">
      Je browser ondersteunt geen WebGL, daarom zijn de animaties niet te zien.
    </p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
